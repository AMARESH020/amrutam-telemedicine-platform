name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-sqlite:
    name: Unit and API tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit

      - name: Check Python syntax
        run: python -m compileall -q app alembic tests

      - name: Run automated tests
        run: python -m pytest -q

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  test-postgresql:
    name: Migration and API tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amrutam
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: amrutam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amrutam -d amrutam"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://amrutam:ci_test_password@localhost:5432/amrutam
      JWT_SECRET: ci-only-secret-not-for-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app alembic tests

      - name: Apply database migrations from an empty database
        run: python -m alembic upgrade head

      - name: Verify Alembic migration head
        run: python -m alembic current

      - name: Run automated tests against PostgreSQL
        run: python -m pytest -q

  test-redis-integration:
    name: Account cooldown API integration (Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: sqlite:////tmp/amrutam_redis_ci_${{ github.run_id }}_${{ github.run_attempt }}.sqlite3
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-not-for-production
      APP_ENV: test
      RUN_REDIS_INTEGRATION_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app alembic tests

      - name: Run real-Redis account cooldown integration test
        run: python -m pytest -q tests/test_redis_integration.py
