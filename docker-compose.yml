services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amrutam
      POSTGRES_USER: amrutam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amrutam -d amrutam"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"

  api:
    build: .
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://amrutam:${POSTGRES_PASSWORD:-change_me_local_only}@db:5432/amrutam
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deployment}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      OTEL_SERVICE_NAME: amrutam-telemedicine-api
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  postgres_data:
